# 推送 v* 标签（或在 Actions 页面手动触发）时，自动把包发布到 npm。
#
# 两种发布方式，workflow 会自动判断用哪一种：
#   1) 仓库里配置了 NPM_TOKEN 密钥  → 用令牌发布（当前方式，简单直接）
#   2) 没有 NPM_TOKEN 密钥          → 走 npm Trusted Publishing (OIDC)，不需要任何令牌
#
# 方式 2 的前置条件（npm 侧配置一次，且账号必须已开启 2FA）：
#   npm trust github @dshcli/dsh-cli --file publish.yml --repo zh591/dshcli --allow-publish
#   配置好之后，删掉仓库里的 NPM_TOKEN 密钥即可自动切换，无需改动本文件。
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只演练流程，不真正发布'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Trusted Publishing 必需：允许 GitHub 签发 OIDC 令牌给 npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node 环境
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 打印版本
        run: node -v && npm -v

      - name: 版本一致性检查（tag 必须与 package.json 一致）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json=$pkg  tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag 与 package.json 的版本不一致，已中止发布"
            exit 1
          fi

      - name: 运行测试
        run: npm test

      - name: 发布到 npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "→ 使用仓库密钥 NPM_TOKEN 发布"
            export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          else
            echo "→ 未配置 NPM_TOKEN，改用 OIDC 可信发布"
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo "→ 演练模式：只跑 npm publish --dry-run，不真正发布"
            npm publish --access public --dry-run
            exit 0
          fi
          npm publish --access public
